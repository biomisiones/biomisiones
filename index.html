<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioMisiones · UPC Ingeniería Biomédica</title>
<style>
:root{--red:#d71920;--teal:#0b7f86;--navy:#0a3f4a;--bg:#eef4f5;--card:#fff;--tx:#17262a;--mu:#5b6b6f;--bd:#d3e0e2;--ok:#1b8a4b;--okbg:#dff3e6;--bad:#c0262d;--badbg:#fbe4e5;--tip:#e3f0f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#ff5a60;--teal:#35c0c6;--navy:#0c2a31;--bg:#0f1719;--card:#17232a;--tx:#e8f1f2;--mu:#9db0b4;--bd:#2a3c42;--ok:#4cd08a;--okbg:#17372a;--bad:#ff7a80;--badbg:#3a1d20;--tip:#1c3037}}
:root[data-theme="dark"]{--red:#ff5a60;--teal:#35c0c6;--navy:#0c2a31;--bg:#0f1719;--card:#17232a;--tx:#e8f1f2;--mu:#9db0b4;--bd:#2a3c42;--ok:#4cd08a;--okbg:#17372a;--bad:#ff7a80;--badbg:#3a1d20;--tip:#1c3037}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:linear-gradient(100deg,var(--navy),var(--teal));color:#fff;border-bottom:4px solid var(--red)}
.top .in{max-width:820px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.top b{font-size:22px}.top .bd{margin-left:auto;background:#fff;color:var(--navy);border-radius:8px;padding:3px 12px;font-size:13px;font-weight:700}
.w{max-width:820px;margin:0 auto;padding:18px}
h1{font-size:clamp(24px,5vw,34px);margin:6px 0 8px;line-height:1.15}h2{font-size:21px;margin:22px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.mu{color:var(--mu);font-size:15px}.chips span{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;margin:0 6px 6px 0;font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}textarea{min-height:100px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}.btn.r{background:var(--red)}.btn:disabled{opacity:.5}
.back{background:none;border:0;color:var(--teal);font:inherit;font-weight:600;cursor:pointer;padding:0 0 10px}
.mc{text-align:center}.mc .ic{font-size:42px}.mc h3{margin:4px 0}.mc p{margin:0 0 10px;color:var(--mu);font-size:14px}
.pill{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:700;border-radius:10px;padding:9px 18px}.lock{opacity:.5}
.prog{height:12px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px}.prog div{height:100%;background:linear-gradient(90deg,var(--ok),var(--teal))}
.ban{background:var(--tip);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin-bottom:14px}.ban .ic{font-size:34px}.ban h3{margin:0;font-size:19px}.ban p{margin:0}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;font-weight:400}.opt.sel{border-color:var(--teal);background:var(--tip);font-weight:700}
.opt i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--tip);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.res{text-align:center;border-radius:14px;padding:22px}.res.ok{background:var(--okbg)}.res.no{background:var(--badbg)}.res .ic{font-size:48px}.res h2{margin:4px 0}
.tipb{background:var(--tip);border-radius:12px;padding:14px 16px;margin:14px 0}.tipb b{color:var(--teal)}
.msg{font-size:14px;margin-top:10px;color:var(--bad)}.pv{max-width:200px;max-height:140px;border-radius:8px;margin-top:8px;border:1px solid var(--bd)}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:14px;margin-right:6px}
#code{font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.1em;background:var(--bg);display:inline-block;padding:8px 16px;border-radius:10px;border:1px dashed var(--teal)}
</style></head><body>
<div class="top"><div class="in"><svg width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5h10M17 5v10L7 33a3 3 0 0 0 3 4h20a3 3 0 0 0 3-4L23 15V5"/><path d="M11 27h5l2-4 3 7 2-3h6" stroke="#ff8a8f"/></svg><b>BioMisiones</b><span class="bd">UPC</span></div></div>
<main class="w" id="app"></main>
<script>
const M=[
{t:"Detective de fuentes",ic:"🔎",s:"Aprende a reconocer información confiable.",
 d:"Busca en la biblioteca UPC, Google Académico o ScienceDirect un artículo sobre un tema de biomédica (sensores ECG, prótesis, imágenes médicas).",
 q:[["Encuentras un artículo en internet para tu trabajo académico. ¿Qué deberías revisar primero?",["Si tiene muchos colores e imágenes.","Quién es el autor y cuáles son sus fuentes.","Si aparece primero en Google."],1,"Es importante verificar la autoría, las fuentes y la evidencia antes de utilizar una información en un trabajo académico.","Aparecer primero o verse atractivo no demuestra que la información sea confiable. Busca autoría, fuentes y evidencia."],
    ["Para un informe de laboratorio, ¿cuál fuente es más adecuada?",["Un video sin autor.","Un artículo de revista científica arbitrada.","Un foro de opiniones."],1,"Las revistas científicas arbitradas pasan por revisión de expertos, por eso son más confiables.","Piensa en qué fuente ha sido revisada por especialistas."]],
 ph:"Sube una captura del artículo donde se vean título, autores, año y revista.",
 r:"¿Qué artículo elegiste y por qué lo consideras confiable? Menciona al menos dos criterios."},
{t:"Rescate del informe",ic:"📝",s:"Mejora la calidad de un informe académico.",
 d:"Crea o abre un informe grupal en Word/OneDrive o Teams. Ordénalo con títulos, reparte secciones por integrante y revisa el historial de versiones.",
 q:[["¿Qué función permite ver quién modificó qué y recuperar versiones anteriores?",["Corrector ortográfico.","Historial de versiones.","Modo de impresión."],1,"El historial de versiones registra los cambios y permite recuperar una versión anterior.","Busca la función que guarda registro de los cambios en el tiempo."],
    ["¿Qué práctica evita desorden en un trabajo grupal?",["Cada uno trabaja en su copia y se une al final.","Un solo archivo compartido con secciones asignadas.","Enviar versiones por chat."],1,"Un archivo compartido con roles claros evita versiones duplicadas y pérdida de cambios.","Piensa en qué opción mantiene una sola versión actualizada."]],
 ph:"Sube una captura del documento con sus títulos y el historial de versiones o comentarios visibles.",
 r:"Explica cómo organizaron el informe y qué problema evitaste al usar herramientas colaborativas."},
{t:"IA bajo revisión",ic:"🤖",s:"Evalúa críticamente la información de la inteligencia artificial.",
 d:"Pregunta a una IA sobre un concepto de biomédica (por ejemplo, cómo funciona un electrocardiograma) y contrasta su respuesta con una fuente confiable.",
 q:[["Una IA te da un dato sin citar fuente. ¿Qué haces?",["Lo copio porque suena convincente.","Lo verifico en una fuente confiable antes de usarlo.","Le pregunto lo mismo a la misma IA."],1,"La IA puede equivocarse: todo dato debe contrastarse con fuentes confiables.","Una respuesta que suena segura no necesariamente es correcta."],
    ["¿Qué es una “alucinación” de la IA?",["Un virus informático.","Una respuesta falsa presentada con seguridad.","Un error de internet."],1,"Las alucinaciones son respuestas inventadas que parecen verosímiles.","Piensa en una respuesta incorrecta pero dicha con mucha seguridad."]],
 ph:"Sube una captura de la respuesta de la IA junto con la fuente que usaste para verificarla.",
 r:"¿Qué dijo la IA, qué verificaste y qué corregirías o confirmarías? Explica tu procedimiento."}];
const $=s=>document.querySelector(s),A=$("#app"),L="ABC";
let S={done:[false,false,false]},used=new Set(),sel=null;
try{S=JSON.parse(localStorage.getItem("bm")||"")||S}catch(e){}
const save=()=>{try{localStorage.setItem("bm",JSON.stringify(S))}catch(e){}};
const n=()=>S.done.filter(Boolean).length;
function home(){A.innerHTML=`<h1>Aprende herramientas digitales haciendo</h1>
<p>Tener herramientas digitales no es lo mismo que saber elegirlas y usarlas para estudiar. En primer año es común perder tiempo buscando fuentes, organizando trabajos grupales o revisando lo que responde una IA. BioMisiones te propone <b>practicar con retos breves</b> de tu vida universitaria.</p>
<div class="chips"><span>Experiencia digital desigual</span><span>Orientación dispersa</span><span>Poca práctica con retroalimentación</span></div>
<h2>Se apoya en</h2><div class="g">
<div class="c"><b>UNESCO 2023</b><p class="mu">La tecnología debe responder a las necesidades reales del estudiante.</p></div>
<div class="c"><b>ODS 4</b><p class="mu">Educación inclusiva, equitativa y de calidad.</p></div>
<div class="c"><b>Carga cognitiva</b><p class="mu">Retos cortos y con pistas evitan saturarte.</p></div>
<div class="c"><b>Primer año</b><p class="mu">Etapa clave de adaptación a la universidad.</p></div></div>
<h2>Cómo funciona</h2><div class="c"><p><span class="num">1</span>Resuelve los desafíos de cada misión y recibe retroalimentación.</p><p><span class="num">2</span>Sube una foto o captura como evidencia y escribe una breve reflexión.</p><p style="margin:0"><span class="num">3</span>Completa las tres misiones y obtén tu <b>crédito extra académico</b>.</p></div>
<h2>Tus datos</h2><div class="c"><label for="nom">Nombre y apellidos</label><input type="text" id="nom" autocomplete="name"><label for="cod">Código UPC (ej. U202512345)</label><input type="text" id="cod" maxlength="10"><div class="msg" id="hm"></div><button class="btn r" id="go">Comenzar</button></div>`;
$("#nom").value=S.nom||"";$("#cod").value=S.cod||"";
$("#go").onclick=()=>{const nom=$("#nom").value.trim(),cod=$("#cod").value.trim().toUpperCase();
 if(nom.split(/\s+/).length<2||!/^U\d{8,9}$/.test(cod))return $("#hm").textContent="Escribe tu nombre completo y un código UPC válido (U + 8 o 9 dígitos).";
 S.nom=nom;S.cod=cod;save();menu()}}
function menu(){scrollTo(0,0);A.innerHTML=`<h1 style="text-align:center">Misiones disponibles</h1><p class="mu" style="text-align:center">Pon a prueba tus habilidades académicas completando estas tres misiones.</p><div class="g" id="cards"></div>
<div class="c" style="margin-top:14px"><b>Tu progreso:</b> ${n()} de 3 misiones completadas<div class="prog"><div style="width:${n()/3*100}%"></div></div></div>${n()===3?'<div style="text-align:center"><button class="btn r" id="fn">🎉 Ver mi constancia</button></div>':""}`;
 M.forEach((m,i)=>{const lk=i>0&&!S.done[i-1]&&!S.done[i],d=document.createElement("div");d.className="c mc"+(lk?" lock":"");
  d.innerHTML=`<div class="ic">${m.ic}</div><h3>Misión ${i+1}: ${m.t}</h3><p>${m.s}</p>`+(S.done[i]?'<span class="pill">✔ Completada</span>':lk?'<span class="mu">🔒 Completa la anterior</span>':'<button class="btn">Iniciar</button>');
  const b=d.querySelector("button");if(b)b.onclick=()=>mission(i,0);$("#cards").appendChild(d)});
 const f=$("#fn");if(f)f.onclick=fin}
function banner(i){const m=M[i];return `<button class="back" id="bk">← Volver al menú</button><div class="ban"><div class="ic">${m.ic}</div><div><h3>Misión ${i+1}: ${m.t}</h3><p class="mu">${m.s}</p></div></div>`}
function mission(i,k){scrollTo(0,0);sel=null;const m=M[i];
 if(k>=m.q.length)return evidence(i);
 const q=m.q[k];A.innerHTML=banner(i)+`<div class="c"><p class="mu" style="margin:0">Desafío ${k+1} de ${m.q.length}</p><p><b>${q[0]}</b></p><div id="ops"></div><button class="btn" id="ck" disabled>Comprobar respuesta</button></div>`;
 $("#bk").onclick=menu;
 q[1].forEach((o,j)=>{const d=document.createElement("label");d.className="opt";d.innerHTML=`<i>${L[j]}</i><span></span>`;d.lastChild.textContent=o;
  d.onclick=()=>{sel=j;document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");$("#ck").disabled=false};$("#ops").appendChild(d)});
 $("#ck").onclick=()=>feedback(i,k,sel===q[2])}
function feedback(i,k,ok){const q=M[i].q[k];
 A.innerHTML=`<button class="back" id="bk">← Volver al menú</button><div class="res ${ok?"ok":"no"}"><div class="ic">${ok?"✅":"❌"}</div><h2>${ok?"¡Respuesta correcta!":"Respuesta incorrecta"}</h2><p>${ok?"Has superado este desafío.":"Inténtalo de nuevo."}</p></div><div class="tipb"><b>💡 Retroalimentación:</b><p style="margin:6px 0 0">${ok?q[3]:q[4]}</p></div><div style="text-align:center"><button class="btn" id="nx">${ok?"Continuar":"Volver a intentar"}</button></div>`;
 $("#bk").onclick=menu;$("#nx").onclick=()=>mission(i,ok?k+1:k)}
const loadImg=f=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=URL.createObjectURL(f)});
function evidence(i){const m=M[i];
 A.innerHTML=banner(i)+`<div class="c"><p><b>Último paso: demuestra que lo hiciste</b></p><p class="mu">${m.d}</p><label>📷 Evidencia</label><p class="mu" style="margin:0">${m.ph}</p><input type="file" accept="image/*" id="fl"><img class="pv" id="pv" hidden alt="Vista previa">
 <label>✍️ Reflexión</label><p class="mu" style="margin:0">${m.r} (mínimo 25 palabras)</p><textarea id="rf"></textarea><div class="msg" id="em"></div><button class="btn r" id="fe">Finalizar misión</button></div>`;
 $("#bk").onclick=menu;
 $("#fl").onchange=e=>{const f=e.target.files[0];if(f){$("#pv").src=URL.createObjectURL(f);$("#pv").hidden=false}};
 $("#fe").onclick=async()=>{const er=t=>($("#em").textContent=t),f=$("#fl").files[0];
  if(!f)return er("Falta subir tu evidencia (foto o captura).");
  if(!f.type.startsWith("image/")||f.size<20000)return er("La imagen no es válida o es muy pequeña. Sube una captura legible.");
  const im=await loadImg(f);if(!im||im.width<400||im.height<300)return er("La imagen debe verse con claridad (mínimo 400×300).");
  const key=f.size+"|"+f.name+"|"+f.lastModified;if(used.has(key))return er("Esa imagen ya la usaste en otra misión. Cada misión necesita su propia evidencia.");
  const w=$("#rf").value.trim().split(/\s+/).filter(Boolean);
  if(w.length<25||new Set(w.map(x=>x.toLowerCase())).size<15)return er("Tu reflexión debe tener al menos 25 palabras con ideas propias.");
  used.add(key);S.done[i]=true;save();n()===3?fin():menu()}}
function fin(){scrollTo(0,0);const h=[...S.cod].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);
 A.innerHTML=`<div class="c" style="text-align:center;border:2px solid var(--ok);padding:28px 16px"><div style="font-size:54px">🎉</div><h1 style="color:var(--ok)">¡Felicidades!</h1><p style="font-size:19px">Conseguiste un <b>crédito extra académico</b>.<br>Completaste las tres BioMisiones con evidencia.</p><p class="mu" id="who"></p><div id="code"></div><p class="mu" style="margin-top:12px">Toma una captura de esta pantalla y compártela con tu docente como constancia.</p><button class="btn" id="pr">Imprimir / guardar PDF</button> <button class="btn r" id="mn">Volver al menú</button></div>`;
 $("#who").textContent=`${S.nom} · ${S.cod} · ${new Date().toLocaleDateString("es-PE")}`;$("#code").textContent="BM-"+String(h).padStart(4,"0")+"-3OK";
 $("#pr").onclick=()=>print();$("#mn").onclick=menu}
S.nom?menu():home();
</script></body></html>
